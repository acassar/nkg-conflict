name: Données mondiales

# Relief et occupation du sol du monde entier (grille 0,1°), publiés sur la branche data-world.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/fetch-terrain-world.py, .github/workflows/data-world.yml]

permissions:
  contents: write

jobs:
  terrain:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow numpy rasterio
      - name: Relief et occupation du sol (monde)
        run: |
          mkdir -p out
          python3 scripts/fetch-terrain-world.py -180 -56 180 78 0.1 out/world-terrain-raw.bin.gz 5 \
            2> out/fetch.log | tee out/summary.json
          tail -30 out/fetch.log
      - name: Publier sur la branche data-world
        if: always()
        run: |
          cd out
          echo "${GITHUB_SHA}" > SHA
          git init -q -b data-world
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Données mondiales pour ${GITHUB_SHA}"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data-world
