name: CI

on:
  push:
    # auto/** : branches des tâches planifiées, vérifiées avant d'être fusionnées dans main.
    branches: [main, 'auto/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Vérifications (format, types, tests, build, partie simulée)
        run: |
          bash ci/checks.sh
          # Rapport d'équilibrage affiché dans le résumé de l'exécution.
          [ -f ci-out/balance/report.md ] && cat ci-out/balance/report.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Test de fumée dans Chromium
        run: |
          if [ -d dist ]; then
            pnpm exec playwright install --with-deps chromium > ci-out/playwright-install.log 2>&1
            pnpm preview --port 4173 --strictPort > ci-out/preview.log 2>&1 &
            npx --yes wait-on@8 -t 30000 http://localhost:4173
            node e2e/smoke.mjs http://localhost:4173 ci-out/smoke 2>&1 | tee ci-out/smoke.log
            node e2e/mobile.mjs http://localhost:4173 ci-out/mobile 2>&1 | tee ci-out/mobile.log
          else
            echo "pas de build, test de fumée ignoré" | tee ci-out/smoke.log
          fi

      # Les logs et artefacts d'Actions ne sont pas lisibles depuis la session de développement :
      # on publie les résultats (logs, captures, build) sur une branche dédiée :
      # ci-results pour main, ci-results-auto pour les branches des tâches planifiées.
      - name: Publier les résultats
        if: always()
        run: |
          set -e
          target=ci-results
          [ "${GITHUB_REF_NAME}" != "main" ] && target=ci-results-auto
          mkdir -p /tmp/results
          cp -r ci-out /tmp/results/ || true
          [ -d dist ] && cp -r dist /tmp/results/dist || true
          echo "${GITHUB_SHA}" > /tmp/results/SHA
          echo "${GITHUB_REF_NAME}" > /tmp/results/BRANCH
          du -sh /tmp/results/* | tee /tmp/results/sizes.txt
          cd /tmp/results
          git init -q -b "$target"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Résultats CI pour ${GITHUB_SHA} (${GITHUB_REF_NAME})"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$target"

      # Le registre npm n'est pas toujours joignable depuis les sessions de développement : les
      # dépendances installées sont publiées sur la branche deps-cache, à chaque changement du
      # lockfile (ou sur demande). Voir scripts/deps-from-cache.sh.
      - name: Publier le cache des dépendances
        if: always() && github.ref_name == 'main'
        run: |
          set -e
          hash=$(sha256sum pnpm-lock.yaml | cut -d' ' -f1)
          current=$(git fetch -q --depth=1 origin deps-cache 2>/dev/null && git show FETCH_HEAD:LOCKHASH 2>/dev/null || echo none)
          if [ "$current" = "$hash" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "cache à jour ($hash)"; exit 0
          fi
          mkdir -p /tmp/deps
          tar -czf /tmp/node_modules.tgz node_modules
          split -b 90m /tmp/node_modules.tgz /tmp/deps/node_modules.tgz.part-
          echo "$hash" > /tmp/deps/LOCKHASH
          cd /tmp/deps
          git init -q -b deps-cache
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Dépendances pour le lockfile $hash"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" deps-cache

      # Branches auto/** des tâches planifiées déjà intégrées à main : supprimées ici, la session de
      # développement n'ayant pas le droit de supprimer des branches.
      - name: Supprimer les branches auto déjà intégrées
        if: always() && github.ref_name == 'main'
        run: |
          git fetch -q --unshallow origin main 2>/dev/null || true
          git fetch -q origin '+refs/heads/auto/*:refs/remotes/origin/auto/*' 2>/dev/null || true
          for ref in $(git for-each-ref --format='%(refname:short)' refs/remotes/origin/auto/); do
            branch=${ref#origin/}
            if git merge-base --is-ancestor "$ref" "$GITHUB_SHA"; then
              echo "suppression de $branch (intégrée à main)"
              git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" --delete "$branch" || true
            fi
          done

      - name: Échec si une vérification a échoué
        run: |
          cat ci-out/status.txt
          grep -q '^failed 0$' ci-out/status.txt
          grep -q 'SMOKE OK' ci-out/smoke.log
          grep -q 'MOBILE OK' ci-out/mobile.log
