name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Vérifications (format, types, tests, build, partie simulée)
        run: bash ci/checks.sh

      - name: Test de fumée dans Chromium
        run: |
          if [ -d dist ]; then
            pnpm exec playwright install --with-deps chromium > ci-out/playwright-install.log 2>&1
            pnpm preview --port 4173 --strictPort > ci-out/preview.log 2>&1 &
            npx --yes wait-on@8 -t 30000 http://localhost:4173
            node e2e/smoke.mjs http://localhost:4173 ci-out/smoke 2>&1 | tee ci-out/smoke.log
          else
            echo "pas de build, test de fumée ignoré" | tee ci-out/smoke.log
          fi

      # Les logs et artefacts d'Actions ne sont pas lisibles depuis la session de développement :
      # on publie les résultats (logs, captures, build, lockfile, dépendances) sur une branche dédiée.
      - name: Publier les résultats sur la branche ci-results
        if: always()
        run: |
          set -e
          mkdir -p /tmp/results
          cp -r ci-out /tmp/results/ || true
          [ -d dist ] && cp -r dist /tmp/results/dist || true
          # Dépendances installées : seulement si package.json ou le lockfile ont changé (≈ 50 Mo).
          if git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -qE '^(package.json|pnpm-lock.yaml)$' \
            || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tar -czf /tmp/node_modules.tgz node_modules
            mkdir -p /tmp/results/cache
            split -b 90m /tmp/node_modules.tgz /tmp/results/cache/node_modules.tgz.part-
          fi
          echo "${GITHUB_SHA}" > /tmp/results/SHA
          du -sh /tmp/results/* | tee /tmp/results/sizes.txt
          cd /tmp/results
          git init -q -b ci-results
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Résultats CI pour ${GITHUB_SHA}"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-results

      - name: Échec si une vérification a échoué
        run: |
          cat ci-out/status.txt
          grep -q '^failed 0$' ci-out/status.txt
          grep -q 'SMOKE OK' ci-out/smoke.log
