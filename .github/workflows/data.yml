name: Données du théâtre

# Télécharge le relief et l'occupation du sol (impossible depuis la session de développement)
# et publie le fichier agrégé sur la branche data-results.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/fetch-terrain.py, .github/workflows/data.yml]

permissions:
  contents: write

jobs:
  terrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Relief et occupation du sol
        run: |
          mkdir -p out
          python3 scripts/fetch-terrain.py 20 43 46 57.5 0.05 out/terrain-raw.json.gz 2> out/fetch.log | tee out/summary.json
          tail -20 out/fetch.log
      - name: Publier sur la branche data-results
        if: always()
        run: |
          cd out
          echo "${GITHUB_SHA}" > SHA
          git init -q -b data-results
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Données du théâtre pour ${GITHUB_SHA}"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data-results
